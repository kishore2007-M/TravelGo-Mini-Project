```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | TravelGo</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0b2545, #087eaa, #35b7a5);
        }

        .reset-card {
            width: 100%;
            max-width: 430px;
            padding: 35px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            color: #087eaa;
            margin-bottom: 10px;
        }

        h2 {
            text-align: center;
            color: #0b2545;
            margin-bottom: 12px;
        }

        .description {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 16px 0 8px;
            color: #0b2545;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #087eaa;
            box-shadow: 0 0 0 3px rgba(8, 126, 170, 0.12);
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #087eaa;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0b2545;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            display: none;
            margin-top: 18px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .back-link {
            display: block;
            margin-top: 22px;
            text-align: center;
            color: #087eaa;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="reset-card">
        <div class="logo">✈️ TravelGo</div>

        <h2>Create New Password</h2>

        <p class="description">
            Choose a new password for your TravelGo account.
        </p>

        <form id="resetPasswordForm">
            <label for="password">New Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter new password"
                minlength="8"
                maxlength="72"
                autocomplete="new-password"
                required
            >

            <label for="confirmPassword">Confirm New Password</label>
            <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                placeholder="Re-enter new password"
                minlength="8"
                maxlength="72"
                autocomplete="new-password"
                required
            >

            <button type="submit" id="resetButton">
                Reset Password
            </button>

            <div id="message" role="status" aria-live="polite"></div>
        </form>

        <a href="./login.html" class="back-link">
            ← Back to Login
        </a>
    </div>

    <script>
        const form = document.getElementById("resetPasswordForm");
        const messageBox = document.getElementById("message");
        const resetButton = document.getElementById("resetButton");

        function showMessage(message, success) {
            messageBox.style.display = "block";
            messageBox.textContent = message;
            messageBox.style.background = success ? "#dcfce7" : "#fee2e2";
            messageBox.style.color = success ? "#166534" : "#991b1b";
        }

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            const password = document.getElementById("password").value;
            const confirmPassword =
                document.getElementById("confirmPassword").value;

            const token = new URLSearchParams(
                window.location.search
            ).get("token");

            if (!token) {
                showMessage(
                    "Reset link is missing. Please request a new password-reset email.",
                    false
                );
                return;
            }

            if (password.length < 8) {
                showMessage(
                    "Password must contain at least 8 characters.",
                    false
                );
                return;
            }

            if (password.length > 72) {
                showMessage(
                    "Password must not exceed 72 characters.",
                    false
                );
                return;
            }

            if (password !== confirmPassword) {
                showMessage(
                    "Passwords do not match. Please try again.",
                    false
                );
                return;
            }

            resetButton.disabled = true;
            resetButton.textContent = "Updating Password...";

            try {
                const response = await fetch("/api/reset-password", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        token: token,
                        password: password
                    })
                });

                const result = await response.json();

                showMessage(
                    result.message ||
                    "Unable to reset your password. Please try again.",
                    response.ok && result.success === true
                );

                if (response.ok && result.success === true) {
                    form.reset();

                    setTimeout(function () {
                        window.location.href = "./login.html";
                    }, 2500);
                } else {
                    resetButton.disabled = false;
                    resetButton.textContent = "Reset Password";
                }
            } catch (error) {
                showMessage(
                    "Unable to connect to TravelGo. Please try again.",
                    false
                );

                resetButton.disabled = false;
                resetButton.textContent = "Reset Password";
            }
        });
    </script>
</body>
</html>
