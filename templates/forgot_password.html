<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | TravelGo</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #06142e, #123b65, #087eaa);
            color: #10243e;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 35px;
            background: rgba(255, 255, 255, 0.97);
            border-radius: 22px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .logo {
            text-align: center;
            color: #087eaa;
            font-size: 29px;
            font-weight: 800;
            margin-bottom: 12px;
        }

        .icon {
            text-align: center;
            font-size: 45px;
            margin: 18px 0;
        }

        h1 {
            text-align: center;
            font-size: 27px;
            color: #10243e;
            margin-bottom: 12px;
        }

        .subtitle {
            text-align: center;
            color: #718096;
            font-size: 14px;
            line-height: 1.7;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 9px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #d5deea;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
            background: #f9fbfd;
        }

        input:focus {
            border-color: #0784a8;
            box-shadow: 0 0 0 3px rgba(7, 132, 168, 0.1);
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #00bfd4, #087eaa);
            color: white;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(8, 126, 170, 0.25);
        }

        button:disabled {
            opacity: 0.65;
            cursor: wait;
            transform: none;
        }

        .message {
            display: none;
            margin-top: 17px;
            padding: 12px;
            border-radius: 9px;
            font-size: 13px;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        .message.error {
            display: block;
            color: #b91c1c;
            background: #fee2e2;
        }

        .message.success {
            display: block;
            color: #166534;
            background: #dcfce7;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 24px;
            color: #087eaa;
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .note {
            text-align: center;
            font-size: 11px;
            color: #718096;
            line-height: 1.6;
            margin-top: 22px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="logo">✈️ TravelGo</div>

        <div class="icon">🔐</div>

        <h1>Forgot Password?</h1>

        <p class="subtitle">
            Don't worry, buddy! Enter the email address associated
            with your TravelGo account to request a password reset.
        </p>

        <form id="forgotPasswordForm">

            <div class="form-group">
                <label for="email">Registered Email Address</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your registered email"
                    autocomplete="email"
                    maxlength="100"
                    required
                >
            </div>

            <button type="submit" id="submitButton">
                Send Password Reset Link
            </button>

            <div
                id="message"
                class="message"
                role="status"
                aria-live="polite"
            ></div>

        </form>

        <a href="./login.html" class="back-link">
            ← Back to Login
        </a>

        <p class="note">
            ✨ TravelGo Account Recovery
            <br>
            For your security, password resets must be verified by the server.
        </p>

    </main>

    <script>
        const form = document.getElementById("forgotPasswordForm");
        const emailInput = document.getElementById("email");
        const submitButton = document.getElementById("submitButton");
        const message = document.getElementById("message");

        function showMessage(type, text) {
            message.className = "message " + type;
            message.textContent = text;
        }

        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            const email = emailInput.value.trim().toLowerCase();

            if (!email) {
                showMessage("error", "Please enter your registered email.");
                return;
            }

            submitButton.disabled = true;
            submitButton.textContent = "Please wait...";
            message.className = "message";
            message.textContent = "";

            try {
                const response = await fetch("/api/forgot-password", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ email: email })
                });

                const responseText = await response.text();

                let result;

                try {
                    result = JSON.parse(responseText);
                } catch {
                    throw new Error(
                        "The server returned an unexpected response."
                    );
                }

                if (!response.ok || !result.success) {
                    throw new Error(
                        result.message || "Unable to process the request."
                    );
                }

                showMessage(
                    "success",
                    result.message ||
                    "If an account matches that email, password-reset instructions will be sent."
                );

                form.reset();

            } catch (error) {
                console.error("Password reset request error:", error);

                showMessage(
                    "error",
                    error.message ||
                    "Could not contact TravelGo. Please check that the server is running."
                );

            } finally {
                submitButton.disabled = false;
                submitButton.textContent = "Send Password Reset Link";
            }
        });
    </script>

</body>
</html>
