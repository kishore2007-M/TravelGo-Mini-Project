<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | TravelGo</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #071b35, #123f67, #087e8b);
            padding: 20px;
        }

        .register-container {
            width: 100%;
            max-width: 420px;
            padding: 35px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.97);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            color: #0b2545;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 28px;
        }

        h2 {
            text-align: center;
            color: #0b2545;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #24364b;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #087e8b;
            box-shadow: 0 0 5px rgba(8, 126, 139, 0.3);
        }

        .register-btn {
            width: 100%;
            padding: 14px;
            margin-top: 8px;
            background: #087e8b;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .register-btn:hover {
            background: #065d68;
            transform: translateY(-2px);
        }

        .register-btn:disabled {
            opacity: 0.65;
            cursor: wait;
            transform: none;
        }

        .message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #64748b;
        }

        .login-link a {
            color: #087e8b;
            font-weight: bold;
            text-decoration: none;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #0b2545;
            text-decoration: none;
        }

        @media (max-width: 480px) {
            .register-container {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

<div class="register-container">

    <div class="logo">✈️ TravelGo</div>

    <p class="subtitle">Your journey starts here!</p>

    <h2>Create Account</h2>

    <form id="registerForm">

        <div class="form-group">
            <label for="name">Full Name</label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your full name"
                autocomplete="name"
                maxlength="100"
                required
            >
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                autocomplete="email"
                maxlength="100"
                required
            >
        </div>

        <div class="form-group">
            <label for="phone">Phone Number</label>

            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="Enter your phone number"
                autocomplete="tel"
                maxlength="20"
                required
            >
        </div>

        <div class="form-group">
            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Create a password"
                autocomplete="new-password"
                minlength="8"
                required
            >
        </div>

        <button type="submit" class="register-btn" id="registerButton">
            Register
        </button>

        <p id="message" class="message" role="status" aria-live="polite"></p>

    </form>

    <div class="login-link">
        Already have an account?
        <a href="./login.html">Login</a>
    </div>

    <a href="./index.html" class="back-link">← Back to Home</a>

</div>

<script>
    const registerForm = document.getElementById("registerForm");
    const message = document.getElementById("message");
    const registerButton = document.getElementById("registerButton");

    registerForm.addEventListener("submit", async function(event) {
        event.preventDefault();

        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim().toLowerCase();
        const phone = document.getElementById("phone").value.trim();
        const password = document.getElementById("password").value;

        message.textContent = "";

        if (!name || !email || !phone || !password) {
            message.style.color = "#b91c1c";
            message.textContent = "Please fill in all fields.";
            return;
        }

        if (password.length < 8) {
            message.style.color = "#b91c1c";
            message.textContent = "Password must contain at least 8 characters.";
            return;
        }

        registerButton.disabled = true;
        registerButton.textContent = "Registering...";
        message.style.color = "#475569";
        message.textContent = "Saving your account to MySQL...";

        try {
            const response = await fetch("/api/register", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    name: name,
                    email: email,
                    phone: phone,
                    password: password
                })
            });

            const result = await response.json();

            if (!response.ok || !result.success) {
                throw new Error(
                    result.message || "Registration failed. Please try again."
                );
            }

            message.style.color = "#087e8b";
            message.textContent =
                "✅ Registration successful! Your account is saved in MySQL.";

            registerForm.reset();

        } catch (error) {
            message.style.color = "#b91c1c";

            if (error instanceof TypeError) {
                message.textContent =
                    "Unable to contact the server. Make sure TravelGo is running at localhost:3000.";
            } else {
                message.textContent = error.message;
            }

        } finally {
            registerButton.disabled = false;
            registerButton.textContent = "Register";
        }
    });
</script>

</body>
</html>
